name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
          - runner: ubuntu-22.04
            platform: linux-x86_64
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libgl1-mesa-dev libasound2-dev mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release
        run: cargo build --release

      - name: Archive Windows executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/wordcraft.exe, target/release/wordcraft-cli.exe -DestinationPath wordcraft-windows-x64.zip

      - name: Archive Unix executables
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: tar -C target/release -czf "wordcraft-$PLATFORM.tar.gz" wordcraft wordcraft-cli

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-${{ matrix.platform }}-release
          path: wordcraft-${{ matrix.platform }}.*
          if-no-files-found: error