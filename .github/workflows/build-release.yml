name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unsigned-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows-x64
          - runner: ubuntu-22.04
            platform: linux-x86_64
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout translations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Phattaraphon-ADMD/craft-i18n
          ref: main
          path: craft-i18n

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libgl1-mesa-dev libasound2-dev mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release
        run: cargo build --release
        env:
          CRAFT_I18N_DIR: ${{ github.workspace }}/craft-i18n
          CRAFT_I18N_REQUIRED: "1"

      - name: Archive Windows executables
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: Compress-Archive -Path target/release/wordcraft.exe, target/release/wordcraft-cli.exe -DestinationPath "wordcraft-$env:VERSION-$env:PLATFORM.zip"

      - name: Archive Unix executables
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.version.outputs.version }}
        run: tar -C target/release -czf "wordcraft-$VERSION-$PLATFORM.tar.gz" wordcraft wordcraft-cli

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-${{ matrix.platform }}-release
          path: wordcraft-${{ needs.version.outputs.version }}-${{ matrix.platform }}.*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: wordcraft-*-release
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists; bump the version before creating a release."
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --title "WordCraft $tag" --notes "These binaries are unsigned and are not notarized." --generate-notes "${prerelease[@]}"